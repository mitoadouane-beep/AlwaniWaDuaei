<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ألواني ودعائي</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff7e6, #e8f8ff);
      min-height: 100vh;
      color: #263238;
    }

    header {
      padding: 25px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .stars {
      background: white;
      padding: 10px 18px;
      border-radius: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      font-weight: bold;
    }

    .hero {
      max-width: 1000px;
      margin: 30px auto;
      padding: 50px 25px;
      text-align: center;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 20px;
      margin-bottom: 30px;
      color: #607d8b;
    }

    .character {
      font-size: 120px;
      margin: 20px;
      animation: floating 2.5s infinite ease-in-out;
    }

    @keyframes floating {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    .start {
      border: none;
      background: #ff8a65;
      color: white;
      font-size: 22px;
      padding: 16px 45px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255,138,101,.3);
    }

    .start:hover {
      transform: scale(1.05);
    }

    .features {
      max-width: 1000px;
      margin: 20px auto 60px;
      padding: 0 20px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .card {
      background: rgba(255,255,255,.85);
      border-radius: 25px;
      padding: 25px 15px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,.07);
    }

    .card .icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card p {
      color: #78909c;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #78909c;
    }

    @media(max-width: 700px) {
      .hero h1 {
        font-size: 34px;
      }

      .features {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    🌈 ألواني ودعائي
  </div>

  <div class="stars">
    ⭐ 0
  </div>

</header>

<section class="hero">

  <div class="character">
    👧
  </div>

  <h1>
    ألواني ودعائي
  </h1>

  <p>
    ألَوّن 🎨 • أتعلم 📚 • أستمع 🤲 • أكتشف ⭐
  </p>

  <button class="start" onclick="startGame()">
    ▶️ ابدأ اللعب
  </button>

</section>

<section class="features">

  <div class="card">
    <div class="icon">🎨</div>
    <h3>ألَوّن</h3>
    <p>صور جميلة وممتعة للتلوين</p>
  </div>

  <div class="card">
    <div class="icon">🤲</div>
    <h3>أستمع</h3>
    <p>أدعية قصيرة وسهلة للأطفال</p>
  </div>

  <div class="card">
    <div class="icon">📚</div>
    <h3>أتعلم</h3>
    <p>الحروف والأرقام والألوان</p>
  </div>

  <div class="card">
    <div class="icon">🏆</div>
    <h3>أكسب</h3>
    <p>نجوم وشارات ومكافآت</p>
  </div>

</section>

<footer>
  © 2026 ألواني ودعائي
</footer>

<script>

function startGame() {

  alert(
    "🌈 مرحبًا بك في ألواني ودعائي!\\n\\nسنبدأ قريبًا بالتلوين والتعلم 🤲🎨"
  );

}

</script>

</body>
</html>
